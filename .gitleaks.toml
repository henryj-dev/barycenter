# gitleaks 설정 — **예외는 좁게, 근거와 함께**
#
# 기본 규칙 묶음을 그대로 쓰고(`useDefault`), 여기서 빼는 것만 적는다. 규칙을 끄는
# 대신 **파일과 값을 둘 다 지정해서** 빼는 이유는, 넓게 뚫어 둔 예외가 나중에 진짜를
# 삼키기 때문이다. 새 예외가 필요하면 왜 필요한지를 여기 적는다.

[extend]
useDefault = true

[[allowlists]]
description = "OIDC 서명 경로를 재는 테스트의 고정 문자열. HS256 은 값이 있어야 서명이 되고, 그 값은 코드에 적힌 그대로가 전부다 — 어디에도 붙지 않는다."
condition = "AND"
paths = ['''^tests/unit/oidc-.*\.test\.ts$''']
regexes = ['''oidc-hs256-secret''']

[[allowlists]]
description = "사람 계정 SSO 테스트의 가짜 IdP 서명값. 테스트 안의 가짜 IdP 가 HS256 ID 토큰을 만들 때만 쓴다 — 어떤 실제 공급자·배포에도 붙지 않는다. IdP OTP 시험(accounts-mfa-idp)도 같은 가짜 IdP 로 SSO 로그인을 만든다. (공용 검사는 모든 브랜치를 훑으므로, 그 테스트가 있는 브랜치보다 먼저 main 에 들어가야 한다.)"
condition = "AND"
paths = ['''^tests/store/accounts-(sso|mfa-idp)\.test\.ts$''']
regexes = ['''idp-hs256-secret''']

# 개인 API 토큰 (2026-11-04). `bary_<lookup 16 hex>_<secret 43 base64url>` — 접두사를 둔 이유가 이 규칙이다.
# 값은 발급 응답에 한 번만 나가고 서버에는 해시만 남는다. 커밋에 섞였다면 진짜 비밀이다 — 예외를 두지 않는다.
# 시험은 값을 실행 중에 만들고 코드에 적지 않는다.
[[rules]]
id = "barycenter-personal-api-token"
description = "Barycenter 개인 API 토큰"
regex = '''\bbary_[0-9a-f]{16}_[A-Za-z0-9_-]{43}'''
keywords = ["bary_"]
