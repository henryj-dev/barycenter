# barycenter CI
#
# **`./scripts/verify.sh` 를 그대로 돌린다.** CI 가 자기만의 단계 목록을 들면 로컬과
# 갈라지고, 갈라지면 어느 쪽이 계약인지 아무도 모른다 — 이 저장소가 문서와 코드에서
# 이미 겪은 병이다(6차 검수). **"전부" 의 정의는 한 군데에만 있어야 한다.**
#
# 조용히 건너뛰지 않는다. 도커가 없으면 `verify.sh` 는 건너뛰는 대신 실패한다 —
# 통과 신호를 위조하는 것보다 빨간 것이 낫다.
#
# **러너는 GitHub hosted 다.** 셀프호스트 ARC 로 잠깐 옮겼다가 되돌렸다 — 공개 저장소에서
# 포크 PR 이 남의 인프라 위에서 도는 것을 만들지 않기 위해서다. 그 회차에 겪은 것을 남긴다:
# 도커 데몬이 옆 컨테이너(dind)면 **`docker run -v <호스트경로>` 의 왼쪽이 러너가 아니라
# 그 컨테이너에서 풀린다** — 골든·스파이크가 물리는 prefix 가 빈 디렉터리가 된다. compose
# 플러그인도 buildx 도 러너 이미지에 없고, 중첩 컨테이너는 이름 해석이 따로 논다.
# **다시 셀프호스트로 옮길 일이 생기면 이 셋을 먼저 확인할 것.**

name: verify

on:
  # 브랜치 전부를 본다. 이 저장소의 작업 흐름은 워크트리 브랜치를 origin 에 밀고
  # 거기서 판정을 받는 것이라, `main` 만 보면 판정이 항상 한 발 늦는다.
  #
  # **`dependabot/**` 만 뺀다.** 밖에서 온 기여는 포크에서 오므로 여기에 push 이벤트를
  # 만들지 않지만, dependabot 은 **이 저장소 안에** 가지를 만들고 그 가지로 PR 을 연다 —
  # 그러면 같은 커밋에 대해 push 와 pull_request 가 각각 전체 스위트를 돌린다(도커까지
  # 두 번 선다). 이 규칙을 넣기 전 첫 dependabot PR 에서 실제로 그랬다.
  # 검사를 잃는 것은 아니다: 그 가지의 판정은 `pull_request` 쪽에서 그대로 난다.
  push:
    branches:
      - '**'
      - '!dependabot/**'
  pull_request:
  # 손으로도 돌릴 수 있게 둔다. 릴리스 전 확인용.
  workflow_dispatch:

# **토큰은 읽기만 준다.** 공개 저장소에서 이 워크플로는 포크가 보낸 코드를 체크아웃해
# 도커까지 띄운다. 이 안의 어떤 단계도 저장소에 쓸 일이 없으므로, 쓰기 권한은 있으면
# 새어 나갈 수 있는 것일 뿐 쓸모가 없다. 잡이 더 필요하면 그 잡에서만 올린다.
permissions:
  contents: read

# 같은 브랜치에 새 푸시가 오면 **앞엣것을 취소한다 — main 도 포함한다.**
#
# ⚠️ **원래 근거는 사라졌다.** 셀프호스트 러너가 하나뿐이던 시절, 낡은 run 이 그 하나를
# 붙들어 최신 커밋이 30분씩 큐에서 굶었다(2026-08-22 실측). hosted 러너로 옮기면서
# 그 굶주림은 없어졌다. 그래도 유지하는 이유는 **가장 최근 커밋의 판정이 가장 빨리
# 나오는 것**이 이 저장소의 작업 리듬(커밋을 잘게, 자주)에 맞기 때문이다.
#
# 대가는 명확하다 — **중간 커밋은 자기 run 이 끝까지 안 갈 수 있다.** 검증을 건너뛰는
# 것은 아니다: 그 커밋을 포함한 최신 run 이 곧 판정한다. 특정 커밋 하나의 초록이
# 필요하면 `workflow_dispatch` 로 그 ref 를 직접 돌린다.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 빠른 신호. 도커 없이 도는 것만 먼저 돌려서 오타 하나에 20 분을 쓰지 않게 한다.
  # **이건 게이트가 아니다** — 아래 `verify` 가 게이트다.
  #
  # **재현물 핀 검사가 여기 얹혀 있다.** 원래 `pinned` 라는 제 잡이었는데 러너가 하나뿐일
  # 때 47초짜리 검사가 20분을 기다리다 취소되는 일이 있어 합쳤다(2026-08-22). hosted 로
  # 옮긴 지금은 나눠도 되지만, 둘 다 도커가 필요 없고 합쳐도 10분이 안 되므로 그대로 둔다.
  #
  # 합쳐서 잃는 것은 체크 두 칸이 하나가 되는 것뿐이다 — 스텝은 그대로 둘이라 어느 쪽이
  # 깨졌는지는 로그에서 바로 보이고, 핀 검사는 `!cancelled()` 로 걸어 **앞의 --quick 이
  # 빨개져도 반드시 돈다**. 안 그러면 한쪽 실패가 다른 쪽 신호를 가린다.
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # **액션은 커밋 SHA 로 박는다.** `@v7` 은 태그이고 태그는 움직인다 — 남의 저장소가
      # 같은 이름 뒤의 코드를 바꾸면 우리 러너가 그걸 그대로 실행한다. 이 저장소는 자기
      # 산출물에 대해서는 이미 재현물 핀을 강제하면서 남의 코드는 이름으로 부르고 있었다.
      # 뒤의 주석은 사람이 읽을 버전이고, dependabot 이 SHA 와 함께 갱신한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # **재현물 게이트가 부모 트리를 세운다.** 얕은 클론이면 `worktree add` 가
          # 그 커밋을 못 찾는다. 저장소가 작으니 통째로 받는다.
          fetch-depth: 0
          # 체크아웃이 남기는 자격증명을 `.git/config` 에 두지 않는다. 이 잡의 git 은
          # 전부 로컬 객체만 읽는다(핀 검사의 `worktree add` 포함) — 네트워크로 나갈
          # 일이 없는데 토큰을 트리에 두면 포크가 보낸 코드가 집을 수 있는 것만 남는다.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 버전은 `.nvmrc` 한 군데에 있다. 워크플로 넷이 잡 여섯을 들고 있는데
          # 숫자를 각자 들면 올릴 때 하나가 남는다 — 이 저장소가 문서에서 이미 겪은
          # 그 병이다. (`deploy/Dockerfile` 의 `node:24-alpine` 은 아직 별개다.)
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: ./scripts/verify.sh --quick

      # **재현물 핀 검사는 푸시된 커밋 전부**를 본다.
      #
      # `verify.sh` 안에서도 돌지만 거기서는 직전 커밋 하나만 본다(로컬 작업 흐름에 맞춘
      # 기본값이다). CI 는 여러 커밋이 한 번에 오므로 범위를 준다 — 가운데 커밋만 재현물
      # 없이 `src/` 를 고쳐도 통과하던 자리를 여기서 막는다.
      - name: 재현물 핀 검사 (푸시된 커밋 전부)
        if: ${{ !cancelled() }}
        # **`${{ }}` 를 `run:` 본문에 박지 않는다.** 그 자리는 셸이 스크립트를 보기 전에
        # 통째로 치환되므로, 값에 따옴표나 `$(...)` 가 섞이면 그대로 셸 코드가 된다.
        # 여기 오는 셋은 SHA 와 브랜치명이라 지금은 안전하지만 — **안전한 것은 값이지
        # 자리가 아니다.** 공개 저장소에서 이 자리는 포크가 고른 값도 받는다.
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # PR 이면 병합 기준점, 푸시면 이전 위치. 새 브랜치의 첫 푸시는 `before` 가
          # 0 이므로 기본 브랜치를 기준으로 삼는다.
          if [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] \
            && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            BASE="$PUSH_BEFORE"
          else
            BASE="$(git rev-parse "origin/$DEFAULT_BRANCH" 2>/dev/null || git rev-parse HEAD~1)"
          fi
          echo "기준: $BASE"
          node scripts/pinned.mjs "$BASE"

  verify:
    runs-on: ubuntu-latest
    # 스파이크 다섯 개가 각각 컨테이너를 세우고 e2e 가 nginx·PG 를 띄운다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # **재현물 게이트가 부모 트리를 세운다.** 얕은 클론이면 `worktree add` 가
          # 그 커밋을 못 찾는다. 저장소가 작으니 통째로 받는다.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # 이미지를 미리 받아 둔다. 안 그러면 첫 스파이크의 타임아웃 안에 pull 이 들어가
      # 느린 날 거짓 실패가 난다.
      - name: 엔진·DB 이미지 준비
        run: |
          docker pull docker.io/openresty/openresty:alpine
          docker pull docker.io/library/postgres:17-alpine

      - run: ./scripts/verify.sh

      # 실패했을 때 남은 컨테이너의 로그를 남긴다. CI 의 실패는 재현이 어려우므로
      # 그때 손에 있는 것을 다 챙긴다.
      - name: 실패 시 컨테이너 상태
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq); do
            echo "───── $c ─────"
            docker logs --tail 50 "$c" 2>&1 || true
          done

  # **문서에 적힌 절차가 정말 도는가.** 문서를 읽어서는 알 수 없고, 손으로 확인하는 한
  # 반드시 썩는다.
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - run: ./scripts/quickstart.sh --clean
      - name: 실패 시 데이터 플레인 로그
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 100 || true

  # 자격증명이 이력에 들어왔는가. **지워진 커밋에 남은 것은 지워지지 않는다** —
  # 공개 저장소에서 한 번 밀린 값은 밀린 순간 이미 밖에 있다.
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        # **액션 대신 바이너리를 직접 받는다.** 받은 것이 무엇인지 체크섬으로 확인할 수
        # 있고, 남의 액션 안으로 토큰을 넘기지 않아도 된다.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o /tmp/gitleaks.tgz "$url"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --exit-code 1 .

  # **워크플로 자체가 공격면이다.** 러너는 밖에서 온 코드를 실행하고, `${{ }}` 가
  # `run:` 본문에 박히면 그게 곧 셸 코드가 된다. 사람은 리뷰에서 반드시 놓친다.
  workflow-audit:
    name: workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o /tmp/actionlint.tgz "$url"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml
      - name: zizmor
        env:
          ZIZMOR_VERSION: "1.29.0"
          ZIZMOR_SHA256: "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839"
        run: |
          set -euo pipefail
          url="https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o /tmp/zizmor.tgz "$url"
          echo "${ZIZMOR_SHA256}  /tmp/zizmor.tgz" | sha256sum -c -
          tar xzf /tmp/zizmor.tgz -C /tmp
          /tmp/zizmor --no-progress --persona=regular .github/workflows

  # **PR 이 무엇을 끌고 들어오는지 본다.** `npm ci` 는 잠금 파일을 그대로 세우므로
  # CI 는 새로 들어온 패키지에 대해 아무 말도 하지 않는다 — 초록이 곧 "이 의존성이
  # 괜찮다" 로 읽히는 자리다.
  dependency-review:
    name: dependency review
    # PR 에서만 뜻이 있다. 기준점이 있어야 "무엇이 새로 들어왔는가" 를 물을 수 있다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # 무엇이 왜 막혔는지 PR 안에 적는다. 로그를 열어야만 알 수 있으면
      # 밖에서 온 기여자는 그냥 막혔다고만 느낀다.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # `moderate` 부터 막으면 전이 의존성의 소음에 파묻힌다. 막는 선은
          # **되돌릴 수 없는 것**에 맞춘다.
          fail-on-severity: high
          # 카피레프트를 거부한다. 정말 필요한 것이 걸리면 여기서 예외를 다는 대신
          # **왜 필요한지를 PR 에 적고** 이 줄을 고친다.
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: on-failure

  # **브랜치 규칙이 거는 이름은 이것 하나다.**
  #
  # 잡 이름을 하나하나 나열하면 이름이 바뀌는 날 그 체크는 "존재하지 않는 체크" 가
  # 되고, 보호는 조용히 사라진다 — GitHub 은 그때 아무 말도 하지 않는다. 여기서
  # 모아 받으면 잡을 늘리고 줄이는 것이 `needs:` 한 줄로 끝나고, 보호 규칙은 안 건드린다.
  gate:
    name: gate
    needs: [quick, verify, quickstart, secret-scan, workflow-audit, dependency-review]
    # 선행 잡이 빨개도 이 잡은 돌아야 한다. 안 그러면 "돌지 않은 체크" 가 되어
    # 규칙이 기다리기만 하고, 무엇이 깨졌는지는 아무 데도 안 적힌다.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 선행 잡 판정
        # `${{ }}` 를 `run:` 본문에 박지 않는다 — 그 자리는 셸이 스크립트를 보기 전에
        # 통째로 치환되므로, 값에 따옴표나 `$(...)` 가 섞이면 그대로 셸 코드가 된다.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$NEEDS"
          # `skipped` 는 통과로 본다 — 이 이벤트에 해당하지 않는 잡이 있다(예: PR 에서만
          # 뜻이 있는 의존성 리뷰). 건너뛴 것과 실패한 것은 다른 말이다.
          bad="$(jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length' <<<"$NEEDS")"
          test "$bad" = "0" || { echo "::error::선행 잡 $bad 개가 통과하지 않았다"; exit 1; }
          echo "게이트 통과"
