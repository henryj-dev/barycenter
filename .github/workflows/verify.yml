# barycenter CI
#
# **`./scripts/verify.sh` 를 그대로 돌린다.** CI 가 자기만의 단계 목록을 들면 로컬과
# 갈라지고, 갈라지면 어느 쪽이 계약인지 아무도 모른다 — 이 저장소가 문서와 코드에서
# 이미 겪은 병이다(6차 검수). **"전부" 의 정의는 한 군데에만 있어야 한다.**
#
# 조용히 건너뛰지 않는다. 도커가 없으면 `verify.sh` 는 건너뛰는 대신 실패한다 —
# 통과 신호를 위조하는 것보다 빨간 것이 낫다.
#
# **러너는 GitHub hosted 다.** 셀프호스트 ARC 로 잠깐 옮겼다가 되돌렸다 — 공개 저장소에서
# 포크 PR 이 남의 인프라 위에서 도는 것을 만들지 않기 위해서다. 그 회차에 겪은 것을 남긴다:
# 도커 데몬이 옆 컨테이너(dind)면 **`docker run -v <호스트경로>` 의 왼쪽이 러너가 아니라
# 그 컨테이너에서 풀린다** — 골든·스파이크가 물리는 prefix 가 빈 디렉터리가 된다. compose
# 플러그인도 buildx 도 러너 이미지에 없고, 중첩 컨테이너는 이름 해석이 따로 논다.
# **다시 셀프호스트로 옮길 일이 생기면 이 셋을 먼저 확인할 것.**

name: verify

on:
  # **main 과 PR 만 본다.**
  #
  # 전에는 브랜치 전부(`'**'`)를 봤다. 근거는 "워크트리 브랜치를 밀고 거기서 판정을
  # 받는다, main 만 보면 판정이 한 발 늦는다" 였고, 그때는 맞았다 — 브랜치 보호가 없어서
  # PR 없이도 main 에 닿을 수 있었기 때문이다.
  #
  # **그 전제가 없어졌다.** 룰셋이 PR 을 강제하므로 main 에 닿는 가지는 전부 PR 을 거치고,
  # 그 PR 의 실행이 곧 그 가지의 판정이다. 브랜치 push 까지 보는 것은 이제 **같은 커밋을
  # 두 번 재는 일**일 뿐이다 — 도커가 두 번 서고, 조각 다섯이 열 개가 되고, 체크 목록에
  # 같은 이름이 나란히 두 줄씩 뜬다.
  #
  # `dependabot/**` 예외도 같이 없앤다. 그 규칙은 정확히 이 중복을 막으려고 있었다.
  #
  # 잃는 것: PR 이 없는 가지는 판정을 안 받는다. 그런 가지는 머지될 수도 없고, 지금
  # 당장 재고 싶으면 `workflow_dispatch` 로 그 ref 를 직접 돌린다.
  push:
    branches: [main]
  pull_request:
  # 손으로도 돌릴 수 있게 둔다. 릴리스 전 확인용, 그리고 PR 없는 가지를 재는 자리.
  workflow_dispatch:

# **토큰은 읽기만 준다.** 공개 저장소에서 이 워크플로는 포크가 보낸 코드를 체크아웃해
# 도커까지 띄운다. 이 안의 어떤 단계도 저장소에 쓸 일이 없으므로, 쓰기 권한은 있으면
# 새어 나갈 수 있는 것일 뿐 쓸모가 없다. 잡이 더 필요하면 그 잡에서만 올린다.
permissions:
  contents: read

# **취소하지 않는다 — `concurrency` 를 안 둔다** (2026-08-29).
#
# 있던 근거는 셀프호스트 러너가 하나뿐이던 시절의 것이었다: 낡은 run 이 그 하나를 붙들어
# 최신 커밋이 30분씩 큐에서 굶었다(2026-08-22 실측). **hosted 러너로 옮기면서 그 근거는
# 사라졌고**, 남아 있던 이유는 "최신 커밋의 판정이 가장 빨리 나온다" 는 리듬뿐이었다.
#
# 그 대가가 적혀 있던 것보다 컸다. 옛 주석은 *"검증을 건너뛰는 것은 아니다 — 그 커밋을
# 포함한 최신 run 이 곧 판정한다"* 고 했는데, **범위를 재는 단계에는 성립하지 않는다.**
# 재현물 핀 검사는 트리가 아니라 `before..head` 라는 **범위**를 보고, 그 범위는 다음
# push 의 `before` 가 이미 지나간 자리에서 시작한다 — 취소된 run 의 커밋들은 어느
# 범위에도 안 들어간다 (검수 2026-08-29(3)).
#
# 러너가 여럿인 지금은 겹쳐 도는 비용이 그 구멍보다 싸다.

jobs:
  # 빠른 신호. 도커 없이 도는 것만 먼저 돌려서 오타 하나에 20 분을 쓰지 않게 한다.
  # **이건 게이트가 아니다** — 아래 `verify` 가 게이트다.
  #
  # **재현물 핀 검사가 여기 얹혀 있다.** 원래 `pinned` 라는 제 잡이었는데 러너가 하나뿐일
  # 때 47초짜리 검사가 20분을 기다리다 취소되는 일이 있어 합쳤다(2026-08-22). hosted 로
  # 옮긴 지금은 나눠도 되지만, 둘 다 도커가 필요 없고 합쳐도 10분이 안 되므로 그대로 둔다.
  #
  # 합쳐서 잃는 것은 체크 두 칸이 하나가 되는 것뿐이다 — 스텝은 그대로 둘이라 어느 쪽이
  # 깨졌는지는 로그에서 바로 보이고, 핀 검사는 `!cancelled()` 로 걸어 **앞의 --quick 이
  # 빨개져도 반드시 돈다**. 안 그러면 한쪽 실패가 다른 쪽 신호를 가린다.
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # **액션은 커밋 SHA 로 박는다.** `@v7` 은 태그이고 태그는 움직인다 — 남의 저장소가
      # 같은 이름 뒤의 코드를 바꾸면 우리 러너가 그걸 그대로 실행한다. 이 저장소는 자기
      # 산출물에 대해서는 이미 재현물 핀을 강제하면서 남의 코드는 이름으로 부르고 있었다.
      # 뒤의 주석은 사람이 읽을 버전이고, dependabot 이 SHA 와 함께 갱신한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # **재현물 게이트가 부모 트리를 세운다.** 얕은 클론이면 `worktree add` 가
          # 그 커밋을 못 찾는다. 저장소가 작으니 통째로 받는다.
          fetch-depth: 0
          # 체크아웃이 남기는 자격증명을 `.git/config` 에 두지 않는다. 이 잡의 git 은
          # 전부 로컬 객체만 읽는다(핀 검사의 `worktree add` 포함) — 네트워크로 나갈
          # 일이 없는데 토큰을 트리에 두면 포크가 보낸 코드가 집을 수 있는 것만 남는다.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 버전은 `.nvmrc` 한 군데에 있다. 워크플로 넷이 잡 여섯을 들고 있는데
          # 숫자를 각자 들면 올릴 때 하나가 남는다 — 이 저장소가 문서에서 이미 겪은
          # 그 병이다. (`deploy/Dockerfile` 의 `node:24-alpine` 은 아직 별개다.)
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: ./scripts/verify.sh --quick

      # **재현물 핀 검사는 푸시된 커밋 전부**를 본다.
      #
      # `verify.sh` 안에서도 돌지만 거기서는 직전 커밋 하나만 본다(로컬 작업 흐름에 맞춘
      # 기본값이다). CI 는 여러 커밋이 한 번에 오므로 범위를 준다 — 가운데 커밋만 재현물
      # 없이 `src/` 를 고쳐도 통과하던 자리를 여기서 막는다.
      - name: 재현물 핀 검사 (푸시된 커밋 전부)
        if: ${{ !cancelled() }}
        # **`${{ }}` 를 `run:` 본문에 박지 않는다.** 그 자리는 셸이 스크립트를 보기 전에
        # 통째로 치환되므로, 값에 따옴표나 `$(...)` 가 섞이면 그대로 셸 코드가 된다.
        # 여기 오는 셋은 SHA 와 브랜치명이라 지금은 안전하지만 — **안전한 것은 값이지
        # 자리가 아니다.** 공개 저장소에서 이 자리는 포크가 고른 값도 받는다.
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # PR 이면 병합 기준점, 푸시면 이전 위치. 새 브랜치의 첫 푸시는 `before` 가
          # 0 이므로 기본 브랜치를 기준으로 삼는다.
          if [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] \
            && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            BASE="$PUSH_BEFORE"
          else
            BASE="$(git rev-parse "origin/$DEFAULT_BRANCH" 2>/dev/null || git rev-parse HEAD~1)"
          fi
          echo "기준: $BASE"
          node scripts/pinned.mjs "$BASE"

  # **조각 목록은 스크립트가 말한다.** 여기에 이름을 적으면 로컬과 갈라지고, 갈라지면
  # 어느 쪽이 계약인지 아무도 모른다 — 그래서 CI 는 `--list-groups` 로 받아 매트릭스를
  # 만든다. 조각을 늘리거나 줄이는 것은 `verify.sh` 한 군데서 끝난다.
  groups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 조각 목록
        id: list
        run: |
          set -euo pipefail
          names="$(./scripts/verify.sh --list-groups)"
          test -n "$names" || { echo "::error::조각 목록이 비었다"; exit 1; }
          echo "$names"
          echo "list=$(printf '%s\n' "$names" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  # **조각마다 러너 하나.** 전에는 열여덟 단위가 한 잡에서 873초를 직렬로 돌았다.
  # 서로 기다릴 이유가 없는 것들이라, 나누면 임계 경로가 가장 긴 단위 하나로 줄어든다.
  verify:
    name: verify (${{ matrix.group }})
    needs: groups
    runs-on: ubuntu-latest
    # 한 조각이 빨개도 나머지는 끝까지 본다 — 한 번에 무엇이 깨졌는지 다 보는 편이
    # 다시 밀어 보는 것보다 싸다.
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.list) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # **재현물 게이트가 부모 트리를 세운다.** 얕은 클론이면 `worktree add` 가
          # 그 커밋을 못 찾는다. 저장소가 작으니 통째로 받는다.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # 이미지를 미리 받아 둔다. 안 그러면 첫 스파이크의 타임아웃 안에 pull 이 들어가
      # 느린 날 거짓 실패가 난다. `unit` 조각은 도커를 안 쓰므로 건너뛴다.
      - name: 엔진·DB 이미지 준비
        if: matrix.group != 'unit'
        run: |
          docker pull docker.io/openresty/openresty:alpine
          docker pull docker.io/library/postgres:17-alpine

      # `${{ }}` 를 `run:` 본문에 박지 않는다. 여기 오는 값은 우리 스크립트가 낸
      # 이름이지만 — **안전한 것은 값이지 자리가 아니다.**
      - name: verify
        env:
          GROUP: ${{ matrix.group }}
        run: ./scripts/verify.sh --group "$GROUP"

      # 실패했을 때 남은 컨테이너의 로그를 남긴다. CI 의 실패는 재현이 어려우므로
      # 그때 손에 있는 것을 다 챙긴다.
      - name: 실패 시 컨테이너 상태
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq); do
            echo "───── $c ─────"
            docker logs --tail 50 "$c" 2>&1 || true
          done

  # **설치 하네스 — `deploy/` 가 바뀔 때만** (검수 2026-08-29(2) D 의 결정).
  #
  # `tests/install/run.sh` 는 다섯 배포판 실물 컨테이너에서 설치·기동·재기동·비-root
  # nginx·특권 포트 apply 까지 본다. 그런데 **`verify.sh` 도 어느 워크플로도 그것을 안
  # 불렀다** — `package.json` 의 `test:install` 뿐이라 사람이 기억해야 돌았다.
  #
  # 그 대가가 실측으로 드러났다: 그 회차에서 `install.sh` 를 고치다 **다섯 판을 전부
  # 깨뜨렸는데** `npm run verify` 는 초록이었고, 텍스트를 읽는 단위 테스트도 통과했다.
  # 잡은 것은 사람이 기억해서 손으로 돌린 하네스뿐이었다.
  #
  # **모든 PR 에 걸지는 않는다.** 다섯 컨테이너는 임계 경로를 크게 늘리고, #15 가
  # 873초를 254초로 줄인 직후다. 바뀐 것이 그것일 때만 잰다.
  #
  # 워크플로 자신도 경로에 넣는다 — 이 잡을 고치는 PR 이 이 잡을 안 돌리면 고친 것이
  # 도는지 알 수 없다.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 기준과 비교하려면 역사가 필요하다.
          fetch-depth: 0
          persist-credentials: false

      # **경로 판정은 셸이 한다.** 액션을 하나 더 들이지 않는다 — 이 저장소는 핀으로
      # 고정한 액션만 쓰고, 하나 늘 때마다 공급망이 한 줄 는다.
      - name: 대상이 바뀌었나
        id: changed
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # **설치가 무엇을 먹고 서는가.** 이 목록이 곧 그 답이다.
          #
          # 처음에는 `deploy/`·`tests/install/`·이 워크플로 셋이었다. #28 이 그 구멍으로
          # 지나갔다 — `gui/package.json` 한 줄(typescript 7)을 바꿨는데 필터에 안 걸려
          # 하네스가 안 돌았고, **머지된 main 이 새 호스트에 설치가 안 되는 상태**가 됐다.
          #
          # 왜 다른 잡이 못 잡았나. **CI 는 전부 핀에서 돈다** — `.nvmrc` 가 24 이고
          # 워크플로들이 그것을 읽는다. 그런데 이 저장소가 선언한 **바닥은 22** 다
          # (`engines.node: ">=22"`, `install.sh` 의 `node_version_ok`). 그 바닥을 실제로
          # 밟아 보는 곳은 **이 하네스뿐이다.**
          #
          # #28 이 정확히 그 틈으로 갔다: `build (dist·gui)` 는 24 의 npm 11 로 돌아
          # 통과했고, 설치 컨테이너의 22 는 npm 10.9 라 같은 트리에서 ERESOLVE 로 죽었다.
          # npm 버전은 바닥이 데리고 오는 것 중 하나일 뿐이라 다음엔 다른 것이 걸린다 —
          # 규칙은 **빌드 입력이 바뀌면 바닥에서도 재 본다**로 세운다.
          #
          # 넓히지는 않는다. `tsconfig*.json` 은 안 넣었다 — 그건 npm 버전과 무관해서
          # `build (dist·gui)` 가 이미 같은 답을 낸다.
          #
          # `tests/unit/install-filter.test.ts` 가 이 값을 읽어 **실제로 grep 을 돌린다.**
          TARGETS: '^(deploy/|tests/install/|scripts/build\.sh$|\.nvmrc$|(gui/)?package(-lock)?\.json$|\.github/workflows/verify\.yml$)'
        run: |
          set -euo pipefail
          if [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] \
            && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            BASE="$PUSH_BEFORE"
          else
            BASE="$(git rev-parse "origin/$DEFAULT_BRANCH" 2>/dev/null || git rev-parse HEAD~1)"
          fi
          echo "기준: $BASE"
          # `workflow_dispatch` 는 언제나 돈다 — 손으로 부르는 자리는 재고 싶을 때다.
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD | grep -Eq "$TARGETS"; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "설치가 쓰는 입력 중 바뀐 것이 없다 — 건너뛴다 ($TARGETS)"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changed.outputs.run == '1'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.changed.outputs.run == '1'
      - run: npm run test:install
        if: steps.changed.outputs.run == '1'

  # **문서에 적힌 절차가 정말 도는가.** 문서를 읽어서는 알 수 없고, 손으로 확인하는 한
  # 반드시 썩는다.
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - run: ./scripts/quickstart.sh --clean
      - name: 실패 시 데이터 플레인 로그
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 100 || true

  # **정책 층은 이 저장소 것이 아니다.** 자격증명·워크플로 감사·의존성 리뷰는 이 저장소가
  # 무엇을 만드는지와 무관하게 다섯 저장소가 같은 것을 묻는 축이다. 복제해 들고 있으면
  # 같은 상태가 유지된다는 보장이 없고, 갈라지기 시작하면 어느 쪽이 기준인지 알 수 없다.
  #
  # 재사용 워크플로는 **부르는 저장소의 맥락에서** 돈다 — 체크아웃도 이 저장소를 받고
  # `.gitleaks.toml` 도 이쪽 것을 읽는다. 예외 목록은 각자 자기 근거와 함께 갖는다.
  #
  # ⚠️ 커밋 SHA 로 박는다. `@main` 이면 저쪽 파일 한 줄이 이 저장소의 게이트를 바꾼다.
  #    dependabot 이 이 SHA 를 갱신한다.
  policy:
    uses: henryj-dev/.github/.github/workflows/policy-checks.yml@f8eab7393216bd0054e6b65297a0cc5baa865630
    permissions:
      contents: read
      # dependency-review 가 무엇이 왜 막혔는지 PR 안에 적는다.
      pull-requests: write
    secrets:
      # 조직 소유 저장소는 gitleaks-action 라이선스가 필수다. org 시크릿에 있다.
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # **브랜치 규칙이 거는 이름은 이것 하나다.**
  #
  # 잡 이름을 하나하나 나열하면 이름이 바뀌는 날 그 체크는 "존재하지 않는 체크" 가
  # 되고, 보호는 조용히 사라진다 — GitHub 은 그때 아무 말도 하지 않는다. 여기서
  # 모아 받으면 잡을 늘리고 줄이는 것이 `needs:` 한 줄로 끝나고, 보호 규칙은 안 건드린다.
  gate:
    name: gate
    needs: [quick, groups, verify, install, quickstart, policy]
    # 선행 잡이 빨개도 이 잡은 돌아야 한다. 안 그러면 "돌지 않은 체크" 가 되어
    # 규칙이 기다리기만 하고, 무엇이 깨졌는지는 아무 데도 안 적힌다.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 선행 잡 판정
        # `${{ }}` 를 `run:` 본문에 박지 않는다 — 그 자리는 셸이 스크립트를 보기 전에
        # 통째로 치환되므로, 값에 따옴표나 `$(...)` 가 섞이면 그대로 셸 코드가 된다.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$NEEDS"
          # `skipped` 는 통과로 본다 — 이 이벤트에 해당하지 않는 잡이 있다(예: PR 에서만
          # 뜻이 있는 의존성 리뷰). 건너뛴 것과 실패한 것은 다른 말이다.
          bad="$(jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length' <<<"$NEEDS")"
          test "$bad" = "0" || { echo "::error::선행 잡 $bad 개가 통과하지 않았다"; exit 1; }
          echo "게이트 통과"
