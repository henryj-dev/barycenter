# 의존성 리뷰 — **PR 이 무엇을 끌고 들어오는지** 본다
#
# `npm ci` 는 잠금 파일을 그대로 세우므로 CI 는 새로 들어온 패키지에 대해 아무 말도
# 하지 않는다. 초록이 곧 "이 의존성이 괜찮다" 로 읽히는 자리다 — 공개 저장소에서
# 밖에서 온 PR 이 잠금 파일 한 줄을 바꾸는 것이 가장 싸게 들어오는 길이다.
#
# 이건 **게이트로 둔다.** CodeQL 과 달리 판정이 명확하기 때문이다: 알려진 고위험
# 취약점이 있는 버전인가, 라이선스가 이 저장소(Apache-2.0)와 섞일 수 있는가.
# 둘 다 사람이 눈으로 볼 수 없고, 통과시키면 되돌리기 어렵다.

name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # 무엇이 왜 막혔는지 PR 안에 적는다. 로그를 열어야만 알 수 있으면
      # 밖에서 온 기여자는 그냥 막혔다고만 느낀다.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # `moderate` 부터 막으면 전이 의존성의 소음에 파묻힌다. 막는 선은
          # **되돌릴 수 없는 것**에 맞춘다.
          fail-on-severity: high
          # **카피레프트를 거부한다.** 이 저장소는 Apache-2.0 으로 배포되고
          # `package.json` 의 `files` 가 `dist/` 를 싣는다 — GPL 계열이 런타임
          # 의존성으로 들어오면 그 배포가 성립하지 않는다. 정말 필요한 것이 걸리면
          # 여기서 예외를 다는 대신 **왜 필요한지를 PR 에 적고** 이 줄을 고친다.
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          comment-summary-in-pr: on-failure
