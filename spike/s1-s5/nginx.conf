# S1 / S5 — 아키텍처 스파이크 (DESIGN.md §12.0)
#
# ⚠️ 버릴 코드다. 프로덕션 구조가 아니라 두 질문에만 답한다.
#
#   S1  balancer_by_lua 로 HTTP·TCP·UDP 세 서브시스템 전부에서 reload 없이
#       백엔드를 바꿀 수 있는가.
#   S5  http zone 과 stream zone 은 별개인데(E14/E25), 양쪽을 갱신했을 때
#       모든 워커가 얼마나 빨리 수렴하는가.
#
# 구조: 멤버십은 shared dict 에 있고 balancer_by_lua 가 매 연결마다 읽는다.
# 컨트롤 플레인(Node)은 dict 를 직접 못 쓰므로, nginx 안의 admin 엔드포인트가
# 대신 쓴다 — 설계 §3.2 의 "DP Agent → admin 소켓" 을 최소 형태로 재현한 것.

worker_processes 4;
daemon off;
error_log logs/error.log warn;
events { worker_connections 256; }

http {
    access_log off;
    lua_shared_dict bary_http 1m;

    init_worker_by_lua_block {
        -- 워커별 로컬 캐시. shared dict 를 매번 읽지 않고 리비전이 바뀔 때만
        -- 다시 만든다 (설계의 "더블버퍼 교체"를 최소로 흉내낸 것).
        _G.bary = { rev = -1, peers = {} }

        -- 수렴 측정을 요청 분배 운에 맡기면 안 된다. 워커마다 타이머로 직접
        -- 동기화하고, 자기가 본 리비전을 dict 에 적어 둔다. 그래야 "모든 워커가
        -- 새 리비전을 봤는가"를 요청을 때리지 않고도 관측할 수 있다.
        local function sync()
            local d = ngx.shared.bary_http
            local rev = d:get("rev") or -1
            if rev ~= _G.bary.rev then
                local peers = {}
                for hp in (d:get("peers") or ""):gmatch("[^,]+") do peers[#peers + 1] = hp end
                _G.bary = { rev = rev, peers = peers }
                -- 이 워커가 새 리비전을 **채택한** 시각. 셸의 date 는 busybox 에서
                -- 나노초를 못 주므로 측정은 엔진 안에서 한다.
                ngx.update_time()
                d:set("worker_at:" .. ngx.worker.id(), ngx.now())
            end
            d:set("worker:" .. ngx.worker.id(), _G.bary.rev)
        end
        sync()
        assert(ngx.timer.every(0.02, sync))
    }

    # ── 백엔드 (자기가 누구인지 말한다) ────────────────────────────────
    server { listen 127.0.0.1:9001; location / { return 200 "A"; } }
    server { listen 127.0.0.1:9002; location / { return 200 "B"; } }

    # ── admin: 멤버십 주입 + 워커 상태 관찰 ────────────────────────────
    server {
        listen 127.0.0.1:8081;

        # POST /http  body="127.0.0.1:9001,127.0.0.1:9002"
        location /http {
            content_by_lua_block {
                local d = ngx.shared.bary_http
                ngx.req.read_body()
                local body = ngx.req.get_body_data() or ""
                d:set("peers", body)
                ngx.update_time()
                d:set("rev_at", ngx.now())      -- 밀어 넣은 시각
                local rev = d:incr("rev", 1, 0)
                ngx.say(rev)
            }
        }

        # 이 요청을 처리한 워커가 보는 리비전.
        location /seen {
            content_by_lua_block {
                ngx.say(ngx.worker.id(), " ", _G.bary.rev, " ", ngx.shared.bary_http:get("rev") or -1)
            }
        }

        # /converged?rev=N → "<본 워커 수> <전체 워커 수> <가장 늦은 워커의 지연 ms>"
        # 요청 분배와 무관하게 전 워커의 상태를 읽는다.
        location /converged {
            content_by_lua_block {
                local d = ngx.shared.bary_http
                local target = tonumber(ngx.var.arg_rev) or -1
                local n = ngx.worker.count()
                local hit, latest = 0, 0
                for i = 0, n - 1 do
                    if (d:get("worker:" .. i) or -1) == target then
                        hit = hit + 1
                        local at = d:get("worker_at:" .. i) or 0
                        if at > latest then latest = at end
                    end
                end
                local lag_ms = -1
                local pushed = d:get("rev_at")
                if hit == n and pushed then lag_ms = math.floor((latest - pushed) * 1000 + 0.5) end
                ngx.say(hit, " ", n, " ", lag_ms)
            }
        }

        # S5 — stream zone 이 http 에서 보이는가 (E25 를 코드 경로로 재확인)
        location /crosszone {
            content_by_lua_block {
                ngx.say(ngx.shared.bary_stream and "VISIBLE" or "NOT_VISIBLE")
            }
        }
    }

    # ── 대상 업스트림 ──────────────────────────────────────────────────
    upstream app {
        server 0.0.0.1:1;              # 자리표시. balancer_by_lua 가 대체한다.
        balancer_by_lua_block {
            local balancer = require "ngx.balancer"
            local d = ngx.shared.bary_http
            local rev = d:get("rev") or -1
            if rev ~= _G.bary.rev then
                local peers = {}
                for hp in (d:get("peers") or ""):gmatch("[^,]+") do peers[#peers + 1] = hp end
                _G.bary = { rev = rev, peers = peers }   -- 통째로 교체 = 더블버퍼
            end
            local peers = _G.bary.peers
            if #peers == 0 then return ngx.exit(503) end
            -- 라운드로빈 대신 첫 peer 를 쓴다. S1 은 "바뀌는가"만 본다.
            local h, p = peers[1]:match("^(.-):(%d+)$")
            assert(balancer.set_current_peer(h, tonumber(p)))
        }
    }

    server {
        listen 127.0.0.1:8080;
        location / { proxy_pass http://app; }
    }
}

stream {
    lua_shared_dict bary_stream 1m;

    init_worker_by_lua_block { _G.baryS = { rev = -1, peers = {} } }

    # ── 백엔드 ─────────────────────────────────────────────────────────
    server { listen 127.0.0.1:9101;     return "A"; }
    server { listen 127.0.0.1:9102;     return "B"; }
    server { listen 127.0.0.1:9201 udp; return "A"; }
    server { listen 127.0.0.1:9202 udp; return "B"; }

    # ── admin: 한 줄 받아서 멤버십으로 삼는다 ──────────────────────────
    server {
        listen 127.0.0.1:8091;
        content_by_lua_block {
            local sock = assert(ngx.req.socket())
            local line = sock:receive("*l")
            local d = ngx.shared.bary_stream
            d:set("peers", line)
            ngx.say(d:incr("rev", 1, 0))
        }
    }

    upstream stcp {
        server 0.0.0.1:1;
        balancer_by_lua_block {
            local balancer = require "ngx.balancer"
            local d = ngx.shared.bary_stream
            local rev = d:get("rev") or -1
            if rev ~= _G.baryS.rev then
                local peers = {}
                for hp in (d:get("peers") or ""):gmatch("[^,]+") do peers[#peers + 1] = hp end
                _G.baryS = { rev = rev, peers = peers }
            end
            if #_G.baryS.peers == 0 then return ngx.exit(ngx.ERROR) end
            local h, p = _G.baryS.peers[1]:match("^(.-):(%d+)$")
            assert(balancer.set_current_peer(h, tonumber(p)))
        }
    }

    upstream sudp {
        server 0.0.0.1:1;
        balancer_by_lua_block {
            local balancer = require "ngx.balancer"
            local d = ngx.shared.bary_stream
            local peers = {}
            for hp in (d:get("peers_udp") or ""):gmatch("[^,]+") do peers[#peers + 1] = hp end
            if #peers == 0 then return ngx.exit(ngx.ERROR) end
            local h, p = peers[1]:match("^(.-):(%d+)$")
            assert(balancer.set_current_peer(h, tonumber(p)))
        }
    }

    server { listen 127.0.0.1:8090;     proxy_pass stcp; }
    server { listen 127.0.0.1:8092 udp; proxy_pass sudp; proxy_responses 1; proxy_timeout 3s; }

    # UDP 멤버십 주입 (TCP 로 받는다)
    server {
        listen 127.0.0.1:8093;
        content_by_lua_block {
            local sock = assert(ngx.req.socket())
            local line = sock:receive("*l")
            ngx.shared.bary_stream:set("peers_udp", line)
            ngx.say("ok")
        }
    }
}
