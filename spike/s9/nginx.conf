# S9 스파이크 — SNI 결과 분기의 관측성 (DESIGN.md §12.0 S9, §4.1)
#
# 백엔드를 **stream-lua** 로 둔다. E26.2 가 "TLS 백엔드로 재실행" 이라고 스킵된 이유는
# 평문 HTTP 백엔드로는 TLS 핸드셰이크가 못 끝나 결과를 못 읽어서였다. 그런데 우리가
# 재려는 것은 핸드셰이크가 아니라 **어느 분기로 갔는가** 다. 백엔드가 연결 즉시 한 줄을
# 뱉으면 클라이언트는 TLS 를 말할 필요가 없다 — 계측기가 하나 줄어든다.
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 64; }

stream {
  access_log off;

  server { listen 127.0.0.1:19901; content_by_lua_block { ngx.say("NON_TLS")    } }
  server { listen 127.0.0.1:19902; content_by_lua_block { ngx.say("TLS_NO_SNI") } }
  server { listen 127.0.0.1:19903; content_by_lua_block { ngx.say("TLS_SNI")    } }

  # §4.1 이 실제로 쓰는 두 map 의 형태 그대로다.
  map $ssl_preread_protocol $tier {
    ""      127.0.0.1:19901;   # preread 가 TLS 를 못 봤다
    default 127.0.0.1:19902;   # TLS 는 맞는데 이름이 없다
  }
  map $ssl_preread_server_name $named {
    ""      $tier;
    default 127.0.0.1:19903;
  }

  server {
    listen 19900;
    ssl_preread on;
    # **2초로 줄인다.** 기본 30초로는 timeout 분기를 관측 가능한 시간 안에 잴 수 없다.
    preread_timeout 2s;
    proxy_pass $named;
  }
}
