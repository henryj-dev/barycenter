# barycenter 최소 배포 — v0.1
#
#   cd deploy && docker compose up --build
#
# **리더 선출이 있다** (§3.5, PG advisory lock). 같은 PG 를 보는 인스턴스를 여러 대
# 띄우면 하나만 리더가 되고 나머지는 **읽기만 답한다**(쓰기는 503 `not_leader`).
# 리더가 죽으면 락이 풀리고 대기하던 인스턴스가 새 토큰으로 승격한다.
#
# ⚠️ 그래도 **자동 페일오버는 아니다** (§11.4). 각 데이터 플레인은 자기 nginx 를 들고
# 있으므로 인스턴스를 늘리는 것은 트래픽을 이중화하는 것이 아니라 **콜드 스탠바이**를
# 두는 것이다. 트래픽 전환은 DNS 나 상위 L4(VIP/keepalived)의 몫이고, 스탠바이가
# 같은 포트를 동시에 bind 하지 않게 하는 것도 아직 운영 절차다.
#
# ⚠️ **데이터 플레인 포트는 손으로 연다.** 리스너를 새로 만들 때마다 여기 `ports` 에
# 그 포트를 더해야 밖에서 닿는다. §11.3 이 적은 그대로다 — 임의 포트를 동적으로
# 노출하는 문제라 v1 권장 배포는 전용 VM + hostNetwork 다.

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: bary
      POSTGRES_DB: bary
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` 만으로는 부족하다 — 초기화 중의 임시 서버도 참을 답한다.
      # 실제 접속으로 확인한다.
      test: ["CMD-SHELL", "psql -U postgres -d bary -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 예제용 백엔드. **제품의 일부가 아니다** — `examples/hello.json` 의 `:11` 이
  # 가리킬 곳이 필요해서 둔다. 실제 배포에서는 지운다.
  demo-backend:
    image: docker.io/openresty/openresty:alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      # http :11 · tcp :12 · udp :13 — `examples/hello.json` 과 `examples/l4.json` 이
      # 가리키는 곳이다. stream 쪽은 `return` 으로 답한다: `ngx.say` 는 **UDP 컨텍스트에서
      # 비활성**이라(`API disabled in the current context`) TCP 에서만 되고 UDP 에서 죽는다.
      - >-
        mkdir -p /b/logs &&
        printf 'error_log logs/e.log warn;\npid logs/p.pid;\nevents{worker_connections 64;}\nstream{server{listen 12;return "hello from TCP:12";}server{listen 13 udp;return "hello from UDP:13";}}\nhttp{access_log off;server{listen 11;location /{return 200 "hello from A:11\\n";}}}\n' > /b/nginx.conf &&
        exec /usr/local/openresty/bin/openresty -p /b -c /b/nginx.conf -g 'daemon off;'

  dataplane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      demo-backend:
        condition: service_started
    environment:
      BARY_DSN: postgres://postgres:bary@db:5432/bary
      # 토큰은 **해시로** 준다. 평문을 받아 주면 그 편의가 기본값이 되고 이 파일이
      # 곧 비밀이 된다. 해시 만들기: `npm run token -- <평문>`
      #
      # 아래는 평문 `dev-token` 의 해시다. **개발용이다 — 그대로 쓰지 말 것.**
      BARY_TOKENS: >-
        [{"name":"dev","scopes":["read","write","apply"],
          "hash":"sha256:c91cbbedf8c712e8e2b7517ddeca8fe4fde839ebd8339e0b2001363002b37712"}]
    ports:
      # 컨트롤 플레인 API. **루프백에만 묶는다** — 인증이 있어도 관리 표면을 기본으로
      # 열어 두지 않는다.
      - "127.0.0.1:8088:8088"
      # 데이터 플레인. **리스너를 새로 만들 때마다 여기 한 줄을 더해야 밖에서 닿는다.**
      # §11.3 이 적은 그대로다 — 임의 포트를 동적으로 노출하는 문제라, v1 권장 배포는
      # 전용 VM + hostNetwork 이고 k8s 네이티브는 별도 과제다.
      - "127.0.0.1:8999:999"          # examples/hello.json — http
      - "127.0.0.1:8998:998"          # examples/l4.json    — tcp
      - "127.0.0.1:8997:997/udp"      # examples/l4.json    — udp
    # **죽으면 다시 띄운다** (검수 D12).
    #
    # `no`(기본값)면 데몬이 죽은 채로 남고, 그러면 nginx 는 옛 세대를 계속 서빙하는데
    # 바꿀 수단이 없다 — 트래픽은 흐르는데 제어가 사라진 상태다. S8 이 실측한
    # *"열린 fd 로 트래픽은 계속 흐르고 다음 reload 만 깨진다"* 와 같은 모양이다.
    #
    # `unless-stopped` 다. `always` 와 달리 사람이 일부러 멈춘 것은 안 되살린다.
    restart: unless-stopped
    # 준비 상태는 Dockerfile 의 `HEALTHCHECK`(`/readyz`)가 답한다. 여기서 다시 적지
    # 않는다 — 두 자리에 두면 갈린다.
    # 세대와 `current` 링크는 **컨테이너 안에서만** 다뤄야 한다 (§3.2 · §7.2).
    # 호스트 bind mount 로 빼면 링크 교체가 엔진 쪽에 안 보인다 — 실측했다.
    volumes:
      - prefix:/prefix

volumes:
  pgdata:
  prefix:

# ── `bary-dp-agent` (원격 모드) 조리법은 **여기 없다** (검수 G7) ──────────
#
# 넣을지 말지를 정해야 했고, **안 넣기로 했다.** 근거는 이 파일이 무엇인지에 있다.
#
# 이 compose 는 **한 대짜리 데모**다 — `demo-backend` 가 들어 있고 그 주석이
# *"제품의 일부가 아니다. 실제 배포에서는 지운다"* 고 적어 뒀다. 원격 모드는 그
# 반대편이다: CP 와 DP 를 **다른 호스트**에 두고 그 사이를 mTLS 로 가른다. 한 compose
# 안에 넣으면 두 컨테이너가 같은 도커 네트워크에 있게 되고, 그러면 **그 구성이 실제로
# 재는 것은 원격이 아니다** — 이 저장소가 반복해서 경계하는 *"흉내로 재면 흉내를
# 재게 된다"* 이다.
#
# 그리고 원격 모드에 필요한 것은 compose 파일이 아니라 **인증서 셋**이다:
# CA · CP 클라이언트 인증서 · 에이전트 서버 인증서. 그것을 만드는 절차를 예시로 적으면
# 그 예시가 곧 「이렇게 하면 된다」로 읽히는데, 키 배포는 배포 환경이 정할 일이다.
#
# **대신 계약은 코드에 있다.** `src/bin/bary-dp-agent.ts` 의 머리말이 환경변수 일곱을
# 적어 두었고, `tests/e2e/agent-in-container.test.ts` 가 그 구성을 **실물로 세워** 돌린다
# — 조리법이 필요하면 그 파일이 정본이다. 문서가 아니라 도는 것이 답한다.
